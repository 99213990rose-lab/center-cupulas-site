name: Teste real do carrinho - temporario
on:
  push:
    branches:
      - feat/mercadopago-checkout-testes-20261008
    paths:
      - '.github/workflows/temporary-browser-e2e.yml'
      - 'tests/browser-e2e.cjs'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar navegador Playwright
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
          google-chrome --version
      - name: Configurador -> carrinho (somente prévia, nenhuma cobrança)
        env:
          E2E_URL: 'https://center-cupulas-site-er3pd34oc-ri-cos.vercel.app/modelos.html?_vercel_share=KxV3nlH7FPfkKAQnu6o1psIYI3N7WVXO#monte'
        run: node tests/browser-e2e.cjs
