name: Center Cupulas - Checkout Health

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'cart.js'
      - 'carrinho.js'
      - 'carrinho.html'
      - 'test/**'
      - 'supabase/functions/**'
      - 'vercel.json'
      - '.github/workflows/center-checkout-health.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'cart.js'
      - 'carrinho.js'
      - 'carrinho.html'
      - 'test/**'
      - 'supabase/functions/**'
      - 'vercel.json'
      - '.github/workflows/center-checkout-health.yml'
  schedule:
    # 09:15 in Brasilia (UTC-3). Read-only; no checkout/payment is created.
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-regressions:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate the checkout and site without real charges
        run: node --test test/*.test.mjs

  production-readiness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check live site pages, private routes and checkout status (read-only)
        run: node scripts/production-smoke.mjs
      - name: Check live payment readiness (read-only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          // Public status is intentionally minimal. Credential/provider checks
          // run privately through Vercel cron at /api/internal/provider-audit.
          const endpoint = 'https://www.centercupulas.com.br/api/mercadopago/status';
          const res = await fetch(endpoint, {
            headers: { accept: 'application/json' },
            signal: AbortSignal.timeout(20000)
          });
          if (!res.ok) throw new Error('Checkout status endpoint unavailable: HTTP ' + res.status);
          const status = await res.json();
          const enabled = status.checkout_enabled === true;
          console.log('Checkout enabled:', enabled);
          if (!enabled) {
            throw new Error('Online checkout needs attention; no charge or order was created.');
          }
          NODE
