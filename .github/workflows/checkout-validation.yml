name: Checkout validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'improve/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check api/mercadopago/create-checkout.js
          node --check api/mercadopago/webhook.js
          node --check api/mercadopago/status.js
          node --check api/frete.js
          node --check carrinho.js
          node --check catalogo.js
      - name: Run checkout unit tests
        run: node --test test/*.test.mjs
