name: Importar catálogo PDF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-catalog.yml"

permissions:
  contents: write

jobs:
  import-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar PDF original
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://at.adobe.com/jlGW69APkietoFBU" \
            -o catalogo.pdf
          test -s catalogo.pdf
          file catalogo.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path("catalogo.pdf")
          data = p.read_bytes()[:5]
          if data != b"%PDF-":
              raise SystemExit("Arquivo baixado não é um PDF válido")
          print(f"PDF válido: {p.stat().st_size} bytes")
          PY

      - name: Salvar PDF no site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Hospeda catálogo PDF no site"
          git push
