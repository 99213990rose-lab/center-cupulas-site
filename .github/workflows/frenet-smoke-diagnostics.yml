name: Mercado Pago credential diagnostic (read only)
on:
  push:
    branches:
      - 'diagnostics/frenet-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check live seller provider connection without creating payments
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 20 \
            'https://www.centercupulas.com.br/api/mercadopago/status?diagnose=connection' \
            --output "$RUNNER_TEMP/mp-health.json"
          HEALTH_FILE="$RUNNER_TEMP/mp-health.json" node <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.env.HEALTH_FILE,'utf8'));
          console.log('PAYMENT_CONNECTION_DIAGNOSTIC:',JSON.stringify({
            checkout_enabled:data.checkout_enabled,
            provider_connection:data.provider_connection||'not_reported',
            connection_issue:data.connection_issue||'none'
          }));
          if(data.provider_connection!=='authorized')process.exitCode=1;
          NODE
