<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#221711">
  <title>Catálogo | Center Cúpulas</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#1d120d;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;flex-direction:column}
    .bar{min-height:58px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#221711;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
    .brand{font-weight:700;letter-spacing:.04em}
    .brand span{color:#d8ad69}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px}
    .btn-main{background:#d8ad69;color:#221711}
    .btn-alt{border:1px solid rgba(255,255,255,.35);color:#fff}
    .viewer{flex:1;width:100%;border:0;background:#fff}
    .fallback{display:none;padding:24px;color:#fff;text-align:center}
    @media(max-width:640px){
      .bar{align-items:flex-start;flex-direction:column}
      .actions{width:100%}
      .btn{flex:1}
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">CENTER <span>CÚPULAS</span> · Catálogo</div>
    <div class="actions">
      <a class="btn btn-alt" href="https://www.centercupulas.com.br/">Voltar ao site</a>
      <a class="btn btn-main" href="https://wa.me/5512983216069?text=Ol%C3%A1%2C%20vim%20pelo%20cat%C3%A1logo%20da%20Center%20C%C3%BApulas%20e%20gostaria%20de%20fazer%20um%20or%C3%A7amento." target="_blank" rel="noopener noreferrer">Solicitar orçamento</a>
    </div>
  </header>

  <iframe
    class="viewer"
    title="Catálogo Center Cúpulas"
    src="https://docs.google.com/gview?embedded=1&url=https%3A%2F%2Fat.adobe.com%2F6FmvYXJP5UWi27Tf"
    allowfullscreen>
  </iframe>

  <noscript>
    <div class="fallback">
      Para visualizar o catálogo, habilite o JavaScript do navegador.
    </div>
  </noscript>
</body>
</html>
